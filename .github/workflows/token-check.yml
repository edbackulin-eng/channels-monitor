name: token-check
# MONITOR_TOKEN can read the four channels' Actions and start a watchdog: one test dispatch.
on:
  workflow_dispatch:
    inputs:
      dispatch_to:
        description: the repository whose watchdog.yml is started once as the test
        default: edbackulin-eng/archive-channel
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Read Actions in every channel, start one watchdog
        env:
          T: ${{ secrets.MONITOR_TOKEN }}
        run: |
          [ -n "$T" ] || { echo "::error::MONITOR_TOKEN is not set"; exit 1; }
          bad=0
          for r in edbackulin-eng/whatif-channel edbackulin-eng/closed-tabs edbackulin-eng/prehistoric-channel edbackulin-eng/archive-channel; do
            code=$(curl -s -o /dev/null -w "%{http_code}" -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$r/actions/workflows/watchdog.yml")
            echo "$r actions read: HTTP $code"
            [ "$code" = 200 ] || bad=1
          done
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: Bearer $T" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ inputs.dispatch_to }}/actions/workflows/watchdog.yml/dispatches" -d '{"ref":"main"}')
          echo "${{ inputs.dispatch_to }} watchdog dispatch: HTTP $code (204 = started)"
          [ "$code" = 204 ] || bad=1
          exit $bad
